services:
  mysql:
    image: mysql:latest
    container_name: mysql
    ports:
    - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "Test@123"
      MYSQL_DATABASE: expenses_tracker
    volumes:
    - ./mysql-data:/var/lib/mysql
    networks:
    - two_tier
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pTest@123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
  
  expensesapp:
    build:
      context: .
    container_name: expensesapp
    env_file:
    - ./.env
    networks:
    - two_tier
    ports:
    - "8080:8080"
    depends_on:
    - mysql
    restart: always

networks:
  two_tier:

  




