apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expensess-app-ingress
  namespace: expensess-app
spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: 
                name: expensess-app-service 
                port:
                  number: 80

